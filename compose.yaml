services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_booking
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket -d ticket_booking']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket_booking
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticket_booking
      DB_USER: ticket
      DB_PASSWORD: ticket
      LOG_LEVEL: info
      RATE_LIMIT_BOOKING_MAX: ${RATE_LIMIT_BOOKING_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed && npm run start:prod']
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
