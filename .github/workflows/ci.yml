name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_booking
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_booking
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket -d ticket_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Apply migration
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Build
        run: npm run build
